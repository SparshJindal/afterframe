services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: afterframe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or .env}
      POSTGRES_DB: afterframe
    volumes:
      - afterframe-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afterframe"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://afterframe:${POSTGRES_PASSWORD}@db:5432/afterframe
      PORT: 3000
      APP_ORIGIN: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  afterframe-data:
